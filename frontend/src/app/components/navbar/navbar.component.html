<header class="nav" [class.nav--hidden]="!isVisible">
  <a class="brand" routerLink="/" aria-label="Inicio">
    <img src="assets/img/ceos-logo.png" alt="CEOS Brand" />
  </a>

  <nav class="links" aria-label="Navegación">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>

    <ng-container *ngIf="authService.currentUser; else guestLinks">
      <ng-container *ngIf="authService.isAdmin; else customerMenu">
        <a routerLink="/productos" routerLinkActive="active">Catálogo</a>
        <a routerLink="/nuevo" routerLinkActive="active">Añadir producto</a>
        <a routerLink="/admin/pedidos" routerLinkActive="active">Pedidos</a>
      </ng-container>

      <ng-template #customerMenu>
        <a routerLink="/sobre-nosotros" routerLinkActive="active">Sobre nosotros</a>
        <a routerLink="/productos" routerLinkActive="active">Catálogo</a>
        <a routerLink="/carrito" routerLinkActive="active">
          Carrito <span class="count" *ngIf="cartService.totalItems > 0">{{ cartService.totalItems }}</span>
        </a>
        <a routerLink="/ayuda" routerLinkActive="active">Ayuda</a>
        <a routerLink="/contacto" routerLinkActive="active">Contáctame</a>
      </ng-template>

      <details class="account-menu">
        <summary class="account-menu__button">
          {{ authService.currentUser!.name }}
        </summary>

        <div class="account-menu__panel">
          <ng-container *ngIf="!authService.isAdmin">
            <a routerLink="/mi-perfil" routerLinkActive="active">Mi perfil</a>
            <a routerLink="/mis-pedidos" routerLinkActive="active">Mis pedidos</a>
          </ng-container>
          <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
        </div>
      </details>
    </ng-container>

    <ng-template #guestLinks>
      <a routerLink="/sobre-nosotros" routerLinkActive="active">Sobre nosotros</a>
      <span class="locked locked--catalog">
        <span class="locked__label">Catálogo</span>
      </span>
      <a routerLink="/ayuda" routerLinkActive="active">Ayuda</a>
      <a routerLink="/register" routerLinkActive="active">Regístrate</a>
      <a routerLink="/login" routerLinkActive="active">Inicia sesión</a>
    </ng-template>
  </nav>
</header>
