<section class="contact-page">
  <div class="contact-shell">
    <div class="contact-copy">
      <p class="eyebrow">Contacto</p>
      <h1>Contáctanos</h1>
      <p>Escribenos cualquier duda sobre pedidos, tallas, productos o colaboraciones.</p>
      <a href="mailto:ceos5oficial@gmail.com">ceos5oficial&#64;gmail.com</a>
    </div>

    <form class="contact-form" [formGroup]="contactForm" (ngSubmit)="submit()">
      <label>
        <span>Nombre</span>
        <input type="text" formControlName="name" autocomplete="name" />
        <small *ngIf="isInvalid('name')">Introduce tu nombre.</small>
      </label>

      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
        <small *ngIf="isInvalid('email')">Introduce un email valido.</small>
      </label>

      <label>
        <span>Asunto</span>
        <input type="text" formControlName="subject" placeholder="Ej: Duda sobre mi pedido" />
        <small *ngIf="isInvalid('subject')">Introduce un asunto.</small>
      </label>

      <label>
        <span>Mensaje</span>
        <textarea formControlName="message" rows="7" placeholder="Cuéntanos que necesitas"></textarea>
        <small *ngIf="isInvalid('message')">Escribe tu mensaje.</small>
      </label>

      <p class="contact-message contact-message--success" *ngIf="successMsg">{{ successMsg }}</p>
      <p class="contact-message contact-message--error" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button type="submit" [disabled]="sending">
        {{ sending ? 'Enviando...' : 'Enviar mensaje' }}
      </button>
    </form>
  </div>
</section>
