spring.application.name=ceos-brand-auth
server.port=8080

spring.datasource.url=${CEOS_DB_URL:jdbc:mysql://127.0.0.1:3306/ceos_brand?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${CEOS_DB_USERNAME:root}
spring.datasource.password=${CEOS_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.mail.host=${CEOS_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${CEOS_MAIL_PORT:587}
spring.mail.username=${CEOS_MAIL_USERNAME:}
spring.mail.password=${CEOS_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

ceos.frontend.base-url=${CEOS_FRONTEND_BASE_URL:http://localhost:4200}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
